<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gmail Signature Generator</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;color:#222;line-height:1.5}
  .top-banner{background:#f6eaf9;border:1px solid #e9d5ff;padding:10px 14px;border-radius:8px;margin-bottom:20px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .top-banner a{color:#742F8A;font-weight:bold;text-decoration:none}
  h2{color:#742F8A;margin-bottom:4px}
  p.s{color:#555;margin-top:0;font-size:14px}
  label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px;color:#333}
  input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}
  input:focus{outline:none;border-color:#742F8A;box-shadow:0 0 0 3px rgba(116,47,138,0.12)}
  button{margin-top:16px;padding:11px 22px;background:#742F8A;color:#fff;border:0;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s}
  button:hover{background:#5d246f}
  #msg{margin-left:12px;font-size:14px;font-weight:500}
  #prev{margin-top:22px;padding:18px;border:1px dashed #cbd5e1;border-radius:8px;min-height:60px;background:#fff}
  .ok{color:#0a7d2c}.err{color:#c0392b}
</style>
</head>
<body>
<div class="top-banner">
  <span>Looking for the full studio with photo cropper & multiple templates?</span>
  <a href="index.html">Open Full Website &rarr;</a>
</div>

<h2>Email Signature Generator</h2>
<p class="s">Fill in your information and Google Drive shareable links below. The live preview updates instantly.</p>

<label for="name">Full Name</label>
<input id="name" placeholder="e.g. John Doe">

<label for="title">Job Title (Line 2)</label>
<input id="title" placeholder="e.g. Senior Project Manager">

<label for="title2">Organization / Subtitle (Line 3 - optional)</label>
<input id="title2" placeholder="e.g. Acme Corporation">

<label for="phone">Phone Number</label>
<input id="phone" placeholder="e.g. +1 (555) 000-0000">

<label for="email">Email Address</label>
<input id="email" placeholder="e.g. john.doe@example.com">

<label for="photo">1. Profile Photo (Google Drive link or Image URL)</label>
<input id="photo" placeholder="https://drive.google.com/file/d/... or direct image link">

<label for="logo">2. Organization Logo (Google Drive link or Image URL)</label>
<input id="logo" placeholder="https://drive.google.com/file/d/... or direct image link">

<label for="fb">3. Facebook Profile / Page URL</label>
<input id="fb" placeholder="https://www.facebook.com/yourname">

<label for="li">4. LinkedIn Profile / Page URL</label>
<input id="li" placeholder="https://www.linkedin.com/in/yourname">

<label for="gh">5. GitHub Profile URL</label>
<input id="gh" placeholder="https://github.com/yourname">

<button id="btn">Copy Signature</button><span id="msg"></span>
<div id="prev"></div>

<script>
function getId(v){
  if(!v) return '';
  v = v.trim();
  var m = v.match(/\/file\/d\/([A-Za-z0-9_-]+)/)
       || v.match(/\/d\/([A-Za-z0-9_-]+)/)
       || v.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{20,}$/.test(v) && !v.includes('/') && !v.includes('.')) return v;
  return '';
}
function getImgSrc(v){
  if(!v) return '';
  v = v.trim();
  if(v.startsWith('data:image/')) return v;
  var id = getId(v);
  if(id) return 'https://lh3.googleusercontent.com/d/' + id;
  if(v.includes('dropbox.com')) return v.replace('?dl=0', '?raw=1').replace('&dl=0', '&raw=1');
  return v;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function build(){
  var photoSrc=getImgSrc(document.getElementById('photo').value);
  var logoSrc=getImgSrc(document.getElementById('logo').value);
  var fbUrl=document.getElementById('fb').value.trim();
  var liUrl=document.getElementById('li').value.trim();
  var ghUrl=document.getElementById('gh') ? document.getElementById('gh').value.trim() : '';

  var nm=document.getElementById('name').value.trim() || 'Your Name';
  var tt=document.getElementById('title').value.trim() || 'Job Title';
  var tt2=document.getElementById('title2').value.trim();
  var ph=document.getElementById('phone').value.trim();
  var em=document.getElementById('email').value.trim();

  var contactRows = '';
  if(ph){
    var cleanTel = ph.replace(/[^\d+]/g,'');
    contactRows += '<tr>'
      + '<td width="20" align="center" valign="middle" style="width:20px;padding:2px 6px 2px 0;color:#742F8A;font-size:14px;line-height:18px;font-family:\'Times New Roman\',Times,serif;">&#9990;</td>'
      + '<td valign="middle" nowrap style="padding:2px 0;font-size:13px;line-height:18px;color:#333333;font-family:\'Times New Roman\',Times,serif;white-space:nowrap;"><a href="tel:'+esc(cleanTel)+'" style="color:#333333;text-decoration:none;font-family:\'Times New Roman\',Times,serif;white-space:nowrap;">'+esc(ph).replace(/ /g,'&nbsp;')+'</a></td>'
      + '</tr>';
  }
  if(em){
    contactRows += '<tr>'
      + '<td width="20" align="center" valign="middle" style="width:20px;padding:2px 6px 2px 0;color:#742F8A;font-size:14px;line-height:18px;font-family:\'Times New Roman\',Times,serif;">&#9993;</td>'
      + '<td valign="middle" nowrap style="padding:2px 0;font-size:13px;line-height:18px;color:#333333;font-family:\'Times New Roman\',Times,serif;white-space:nowrap;"><a href="mailto:'+esc(em)+'" style="color:#333333;text-decoration:none;font-family:\'Times New Roman\',Times,serif;white-space:nowrap;">'+esc(em)+'</a></td>'
      + '</tr>';
  }

  var socialCells = '';
  if(fbUrl){
    socialCells += '<td valign="middle"><a href="'+esc(fbUrl)+'" target="_blank"><img src="https://cdn-icons-png.flaticon.com/32/733/733547.png" width="20" height="20" alt="Facebook" style="display:block;border:0;"></a></td>';
  }
  if(fbUrl && (liUrl || ghUrl)){
    socialCells += '<td width="10" style="font-size:0;">&nbsp;</td>';
  }
  if(liUrl){
    socialCells += '<td valign="middle"><a href="'+esc(liUrl)+'" target="_blank"><img src="https://cdn-icons-png.flaticon.com/32/3536/3536505.png" width="20" height="20" alt="LinkedIn" style="display:block;border:0;"></a></td>';
  }
  if(liUrl && ghUrl){
    socialCells += '<td width="10" style="font-size:0;">&nbsp;</td>';
  }
  if(ghUrl){
    socialCells += '<td valign="middle"><a href="'+esc(ghUrl)+'" target="_blank"><img src="https://cdn-icons-png.flaticon.com/32/25/25231.png" width="20" height="20" alt="GitHub" style="display:block;border:0;"></a></td>';
  }

  return '<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:\'Times New Roman\',Times,serif;">'
    + '<tr>'
    + '<td colspan="3" style="padding:0 0 8px 0;border-bottom:1px solid #742F8A;">'
    + '<div style="font-family:\'Times New Roman\',Times,serif;font-size:20px;font-weight:bold;color:#742F8A;letter-spacing:.5px;line-height:24px;white-space:nowrap;">'+esc(nm)+'</div>'
    + '<div style="font-family:\'Times New Roman\',Times,serif;font-size:13px;font-weight:bold;color:#0152A1;letter-spacing:.5px;line-height:18px;padding-top:4px;white-space:nowrap;">'+esc(tt)+'</div>'
    + (tt2 ? '<div style="font-family:\'Times New Roman\',Times,serif;font-size:13px;font-weight:bold;color:#0152A1;letter-spacing:.5px;line-height:18px;white-space:nowrap;">'+esc(tt2)+'</div>' : '')
    + '</td>'
    + '</tr>'
    + '<tr>'
    + (photoSrc ? '<td valign="middle" align="center" style="padding:12px 18px 0 0;"><img src="'+esc(photoSrc)+'" width="115" height="115" alt="'+esc(nm)+'" style="display:block;width:115px;height:115px;border-radius:50%;object-fit:cover;border:0;"></td>' : '')
    + '<td valign="middle" nowrap style="padding:12px 20px 0 0;white-space:nowrap;">'
    + '<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">'
    + contactRows
    + '</table>'
    + (socialCells ? '<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:8px;"><tr>' + socialCells + '</tr></table>' : '')
    + '</td>'
    + (logoSrc ? '<td valign="middle" align="center" style="padding:12px 0 0 0;"><img src="'+esc(logoSrc)+'" width="95" alt="Logo" style="display:block;width:95px;height:auto;border:0;"></td>' : '')
    + '</tr>'
    + '</table>';
}

function render(){ prev.innerHTML=build(); }
['name','title','title2','phone','email','photo','logo','fb','li','gh'].forEach(function(k){
  var el = document.getElementById(k);
  if(el) el.addEventListener('input', render);
});

btn.onclick=function(){
  render();
  var r=document.createRange(); r.selectNodeContents(prev);
  var s=getSelection(); s.removeAllRanges(); s.addRange(r);
  var ok=false; try{ok=document.execCommand('copy');}catch(e){}
  s.removeAllRanges();
  msg.className=ok?'ok':'err';
  msg.textContent=ok?'Copied! Now paste directly into Gmail signature settings.':'Could not copy automatically. Please select preview and press Ctrl+C.';
};
render();
</script>
</body>
</html>
